<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>RenKairo - AI-Powered Cloud Orchestration & Developer Workspace</title>
    <meta name="title" content="RenKairo - AI-Powered Cloud Orchestration & Developer Workspace" />
    <meta name="description" content="Technical deep-dives, architectural breakdown, and official v1.0.0 installer download for RenKairo — the intelligent multi-cloud & local compute orchestration engine." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://renkairo.io/" />
    <meta property="og:title" content="RenKairo - AI-Powered Cloud Orchestration Engine & IDE" />
    <meta property="og:description" content="Natural language cloud orchestration, bare-metal node joining over SSH, disposable Colab GPUs, and Electron+Monaco Desktop IDE." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('renkairo-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'light' || (!saved && !prefersDark)) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fcfbf9] text-slate-900 dark:bg-[#0a0b0e] dark:text-slate-100 font-sans antialiased selection:bg-red-700 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
